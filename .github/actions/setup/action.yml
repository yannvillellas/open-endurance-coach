name: Setup
description: Set up Python and install the development dependencies

inputs:
  python-version:
    description: Python version to set up
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: "pip"
        cache-dependency-path: pyproject.toml
    - name: Install
      shell: bash
      run: pip install -e ".[dev]"
