name: Tests
description: Run the test suite with pytest

inputs:
  python-version:
    description: Python version, used in the annotation
    required: false
    default: "3.12"
  args:
    description: Extra pytest arguments (for example a test path)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Tests (pytest)
      shell: bash
      run: |
        set +e
        pytest -q ${{ inputs.args }} 2>&1 | tee "$RUNNER_TEMP/pytest.log"
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          summary=$(grep -E '[0-9]+ (failed|error)' "$RUNNER_TEMP/pytest.log" | tail -n 1)
          message="${summary:-the suite is not 100% green}; see the job log"
          echo "::warning title=Tests not green::${message}"
          {
            echo "### Tests not green (Python ${{ inputs.python-version }})"
            echo
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit "$status"
