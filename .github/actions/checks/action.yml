name: Code checks
description: Install dev dependencies and run ruff, mypy, and pytest

inputs:
  python-version:
    description: Python version to set up
    required: false
    default: "3.12"
  refresh-spec:
    description: Re-download the OpenAPI snapshot before running checks
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install
      shell: bash
      run: pip install -e ".[dev]"
    - name: Refresh OpenAPI snapshot
      if: inputs.refresh-spec == 'true'
      shell: bash
      run: refresh-spec
    - name: Lint (ruff)
      shell: bash
      run: ruff check . && ruff format --check .
    - name: Types (mypy)
      shell: bash
      run: mypy src tests
    - name: Tests (pytest)
      shell: bash
      run: pytest -q
