name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: "3.12"
      - uses: ./.github/actions/lint

  tests:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - id: tests
        uses: ./.github/actions/tests
        with:
          python-version: ${{ matrix.python-version }}
      - name: Warn when the tests could not run
        if: failure() && steps.tests.outcome == 'skipped'
        run: |
          message="the tests could not run (setup failed?); see the job log"
          echo "::warning title=Tests could not run::${message}"
          {
            echo "### Tests could not run (Python ${{ matrix.python-version }})"
            echo
            echo "${message}"
          } >> "$GITHUB_STEP_SUMMARY"
