name: API spec drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Refresh OpenAPI snapshot
        run: refresh-spec
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- tests/spec/openapi.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open PR with the new snapshot
        if: steps.drift.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b spec-drift
          git add tests/spec/openapi.json
          git commit -m "test: refresh Intervals.icu OpenAPI snapshot"
          git push origin spec-drift
          gh pr create \
            --title "Intervals.icu API spec changed" \
            --body "The vendored OpenAPI snapshot drifted from the live spec. Review the diff; if consumed endpoints or parameters changed, run \`record-fixtures\` and adapt the code." \
            --base main \
            --head spec-drift
